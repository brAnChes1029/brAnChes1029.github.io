<style>
/* 分類列表選單樣式 */
.gallery-categories {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 30px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

/* 分類名稱的樣式 */
.category-link {
    font-size: 1.1rem;
    color: #fff !important;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.2s, padding-left 0.2s;
    display: flex;
    align-items: center;
}

.category-link:hover, .category-link.active {
    padding-left: 5px;
}

/* 返回列表按鈕 */
.back-to-list {
    display: none;
    font-size: 0.9rem;
    color: #888 !important;
    text-decoration: none;
    cursor: pointer;
    margin-bottom: 20px;
}
.back-to-list:hover {
    color: #fff !important;
}

/* 各個圖片牆的容器 */
.gallery-tab-content {
    display: none;
}

/* 縮圖牆基本樣式 */
.gallery-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)) !important;
    gap: 12px !important;
    padding: 20px 0 !important;
}

.gallery-item {
    overflow: hidden !important;
    border-radius: 4px !important;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08) !important;
    transition: transform 0.2s ease !important;
    aspect-ratio: 1 / 1 !important;
    cursor: pointer !important;
}

.gallery-item:hover {
    transform: scale(1.05) !important;
}

.gallery-item img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    display: block !important;
}

/* 獨立遮罩層 */
.gallery-modal {
    display: none; 
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    background-color: rgba(0, 0, 0, 0.9) !important;
    z-index: 999999 !important;
    justify-content: center !important;
    align-items: center !important;
    cursor: zoom-out !important;
    padding: 20px !important;
    box-sizing: border-box !important;
}

.gallery-modal img {
    max-width: 90% !important;
    max-height: 75% !important;
    object-fit: contain !important;
    box-shadow: 0 0 20px rgba(0,0,0,0.5) !important;
}

/* 大圖下方的靠左文字框 */
.gallery-modal-caption {
    color: #ffffff !important;
    font-size: 0.95rem !important;
    margin-top: 15px !important;
    text-align: left !important;
    width: 90% !important;
    max-width: 1200px !important;
    max-height: 20vh !important;
    overflow-y: auto !important;
    line-height: 1.6 !important;
    white-space: pre-wrap !important;
    word-break: break-word !important;
    background: #2A2E2B !important;
    padding: 16px !important;
    border-radius: 4px !important;
    
    /* 💡 上下兩端的分隔橫線 */
    border-top: none !important;
    border-bottom: none !important;
    border-left: none !important;
    border-right: none !important;
    
    cursor: auto !important;
}

<!-- 彈出的大圖與說明遮罩層 -->
<div id="galleryModal" class="gallery-modal" onclick="closeGalleryModal(event)">
    <img id="galleryModalImg" src="" alt="Large Image">
    <div id="galleryModalCaption" class="gallery-modal-caption" onclick="event.stopPropagation()"></div>
</div>

<script>
// 切換到指定的分類
function switchGallery(tabId) {
    document.getElementById('categoryMenu').style.display = 'none';
    document.getElementById('backButton').style.display = 'block';
    
    var contents = document.getElementsByClassName('gallery-tab-content');
    for (var i = 0; i < contents.length; i++) {
        contents[i].style.display = 'none';
    }
    
    var targetTab = document.getElementById('tab-' + tabId);
    if (targetTab) {
        targetTab.style.display = 'block';
    }
}

// 返回分類選單
function showAllCategories() {
    document.getElementById('categoryMenu').style.display = 'flex';
    document.getElementById('backButton').style.display = 'none';
    
    var contents = document.getElementsByClassName('gallery-tab-content');
    for (var i = 0; i < contents.length; i++) {
        contents[i].style.display = 'none';
    }
}

// 點擊縮圖打開大圖與說明
function openGalleryModal(imgUrl, captionText) {
    var modal = document.getElementById('galleryModal');
    var modalImg = document.getElementById('galleryModalImg');
    var caption = document.getElementById('galleryModalCaption');
    
    if (modal && modalImg) {
        modalImg.src = imgUrl;
        
        if (caption) {
            if (captionText && captionText.trim() !== '') {
                // 💡 關鍵修改：改用 innerHTML 以支援刪除線等 HTML 標籤
                caption.innerHTML = captionText;
                caption.style.display = 'block';
            } else {
                caption.style.display = 'none';
            }
        }
        
        modal.style.display = 'flex';
        modal.style.flexDirection = 'column';
    }
}

// 點擊任意黑色背景處關閉大圖
function closeGalleryModal(event) {
    var modal = document.getElementById('galleryModal');
    if (event.target.id === 'galleryModal' || event.target.id === 'galleryModalImg') {
        if (modal) {
            modal.style.display = 'none';
        }
    }
}
</script>
